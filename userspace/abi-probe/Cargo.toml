[package]
name = "abi-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kryo-libsys = { path = "../libsys" }
kryo-interfaces = { path = "../../interfaces" }

[workspace]
resolver = "3"

[profile.dev]
panic = "abort"
opt-level = 1
debug = true

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
debug = true
