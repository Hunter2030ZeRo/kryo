[package]
name = "rust-std-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cryolite-allocator = { path = "../../libc/allocator", features = ["std"] }

[workspace]

[profile.dev]
panic = "abort"
opt-level = 1
debug = true

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
opt-level = 3
debug = 1
