[workspace]
resolver = "3"
members = ["hal", "interfaces", "kernel/core", "kernel/image"]
default-members = ["kernel/image"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
kryo-hal = { path = "hal" }
kryo-core = { path = "kernel/core" }
kryo-interfaces = { path = "interfaces" }
limine = "=0.6.5"
spin = "0.12.3"
x86_64 = "0.15.5"
talc = { version = "=5.1.1", default-features = false }

[profile.dev]
panic = "abort"
codegen-units = 16
opt-level = 0
debug = true

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
debug = 1
opt-level = 3


