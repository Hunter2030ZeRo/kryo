timeout: 5
verbose: yes

/Kryo
	protocol: limine
	kernel_path: boot():/boot/kryo
	module_path: boot():/boot/native-smoke.elf
	module_cmdline: kryo-native-smoke
	module_path: boot():/boot/init.elf
	module_cmdline: kryo-init
	module_path: boot():/boot/bootstrap-worker.elf
	module_cmdline: kryo-worker
	module_path: boot():/boot/device-probe.elf
	module_cmdline: kryo-device-probe
	module_path: boot():/boot/scale-probe.elf
	module_cmdline: kryo-scale-probe
	module_path: boot():/boot/service-probe.elf
	module_cmdline: kryo-service-probe
	module_path: boot():/boot/service-peer.elf
	module_cmdline: kryo-service-peer
	module_path: boot():/boot/supervisor.elf
	module_cmdline: kryo-supervisor
	module_path: boot():/boot/echo-service.elf
	module_cmdline: kryo-echo-service
	module_path: boot():/boot/registry-client.elf
	module_cmdline: kryo-registry-client
